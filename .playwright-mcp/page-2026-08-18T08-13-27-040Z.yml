      - generic [ref=f1e132]:
        - generic [ref=f1e133]: The three layers
        - heading "Three security challenges. Three proven solutions." [level=2] [ref=f1e134]
        - paragraph [ref=f1e135]: Every solution addresses a distinct layer of fraud risk in banking's digital channels. They work independently and share a common signal layer that makes each one more accurate when deployed together.
        - generic [ref=f1e136]:
          - paragraph [ref=f1e142]:
            - text: Layer 01
            - generic [ref=f1e143]: ekShield · ekBind
          - generic [ref=f1e144]:
            - heading "Device-bound authentication, bound to a verified SIM" [level=3] [ref=f1e145]
            - paragraph [ref=f1e146]: Replace SMS OTP with phishing-resistant, device-bound authentication across every channel — mobile, web, call centre, ATM, and 3DS. ekBind adds SIM binding via Silent Network Authentication and Reverse SMS, so a swapped SIM is caught before a transaction proceeds. Compliant with CBUAE, RBI, SAMA, BSP, and MAS mandates.
          - link "Open →" [ref=f1e148] [cursor=pointer]:
            - /url: /ekshield
        - generic [ref=f1e149]:
          - paragraph [ref=f1e153]:
            - text: Layer 02
            - generic [ref=f1e154]: ekProtect
          - generic [ref=f1e155]:
            - heading "Attestation, runtime defence and behavioural risk" [level=3] [ref=f1e156]
            - paragraph [ref=f1e157]: Attest device and app integrity, detect malware, overlay attacks, rooted devices, and remote access tools — from inside the banking app — and suspend the session automatically when a threat is found. Behavioural analysis and ML-driven per-transaction risk decisioning turn every signal into a real-time score. CBUAE-mandated.
          - link "Open →" [ref=f1e159] [cursor=pointer]:
            - /url: /ekprotect
        - generic [ref=f1e160]:
          - paragraph [ref=f1e165]:
            - text: Layer 03
            - generic [ref=f1e166]: ekSign
          - generic [ref=f1e167]:
            - heading "In-channel signing with cryptographic proof" [level=3] [ref=f1e168]
            - paragraph [ref=f1e169]: Customers sign inside the banking app or on a bank-branded page, authenticated by the MFA they already use. Each signature is bound to a SHA-256 fingerprint of the document and chained across signatories, so any later alteration fails verification — and the bank keeps the record.
          - link "Open →" [ref=f1e171] [cursor=pointer]:
            - /url: /eksign
        - generic [ref=f1e173]:
          - paragraph [ref=f1e174]: Shared signal layer
          - paragraph [ref=f1e175]: all three layers feed one signal layer — each product becomes more accurate with every other product a bank deploys.
      - generic [ref=f1e178]:
        - generic [ref=f1e179]: Cryptographic proof
        - heading "Signed at issuance. Verified in milliseconds." [level=2] [ref=f1e180]
        - generic [ref=f1e181]:
          - generic [ref=f1e182]:
            - paragraph [ref=f1e183]: Every document a bank issues is signed with an ECDSA key pair at the moment of creation. Alter one character and the signature no longer matches — tampering stops being a judgement call and becomes arithmetic.
            - generic [ref=f1e184]:
              - generic [ref=f1e191]:
                - generic [ref=f1e192]: Sign
                - text: Issuing system calls one API; ECDSA P-256 signature bound to the document's exact contents.
              - generic [ref=f1e199]:
                - generic [ref=f1e200]: Seal
                - text: A QR seal carries the signature and verification endpoint; no change to the document workflow.
              - generic [ref=f1e209]:
                - generic [ref=f1e210]: Verify
                - text: Any party scans the seal; authenticity returns in milliseconds — no login, no portal, no callback to the bank.
          - img "Placeholder" [ref=f1e211]
