      - generic [ref=f1e244]:
        - generic [ref=f1e245]: Regulatory tailwinds
        - heading "Regulators are ordering the upgrade." [level=2] [ref=f1e246]
        - paragraph [ref=f1e247]: Across the GCC, South Asia, and Southeast Asia, regulators have banned SMS OTP, mandated passkeys, and required real-time malware detection. Every bank in these markets needs what Ektar builds — and many have a hard deadline to decide.
        - generic [ref=f1e248]:
          - paragraph [ref=f1e251]:
            - strong [ref=f1e252]: UAE — CBUAE Notice 3057.
            - text: SMS OTP and email OTP banned. In-app verification, passkeys, and biometrics mandated. Real-time malware session suspension required.
          - paragraph [ref=f1e255]:
            - strong [ref=f1e256]: Saudi Arabia — SAMA Counter-Fraud Framework.
            - text: FIDO2 device-bound credentials mandated. Real-time fraud monitoring required. Penalties up to SAR 5M per breach.
          - paragraph [ref=f1e259]:
            - strong [ref=f1e260]: India — RBI Authentication Directions 2025.
            - text: Sole reliance on SMS OTP banned for high-risk transactions. Real-time risk-based authentication mandatory per transaction.
          - paragraph [ref=f1e263]:
            - strong [ref=f1e264]: Singapore — MAS/ABS Directive.
            - text: SMS OTP phased out for all retail bank digital token users.
          - paragraph [ref=f1e267]:
            - strong [ref=f1e268]: Philippines — BSP Circular 1213.
            - text: Direct prohibition on SMS/email OTP for high-risk banking transactions.
          - paragraph [ref=f1e271]:
            - strong [ref=f1e272]: Malaysia — BNM RMiT 2026.
            - text: Device binding, adaptive MFA, and risk-based authentication mandated for all licensed banks.
