        - generic [ref=f1e91]: The attack surface
        - heading "Six ways into a banking app. Ektar closes all six." [level=2] [ref=f1e92]
        - paragraph [ref=f1e93]: Mobile apps, internet banking portals, and payment APIs created an attack surface fraudsters can probe from anywhere, at scale, at near-zero cost. These are the vectors we shut down.
        - generic [ref=f1e94]:
          - generic [ref=f1e95]:
